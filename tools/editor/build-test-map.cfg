//
// Builds the map editor/built1 from nothing with the editor's console commands, compiles it and
// plays it: the regression script of the brush editing. Copy it into <fs_savepath>/base and run
//   Doom3Editor.exe +set fs_basepath <game> +set fs_savepath <dir> +exec build-test-map.cfg
// The lines to look for in qconsole.log:
//   editorBuild: OK, 1 areas, 0 portals ...                   one hollow box
//   editorBuild: OK, 2 areas, 1 portals ... 0 AAS files       two rooms, a doorway, a visportal
//   editorBuild: OK, 2 areas, 1 portals ... 1 AAS files       with a monster
//   aiStatus monster_zombie_fat_1: ... aas aas48, enemy player1, to player <shrinking>
wait 30
editorNewMap editor/built1
editorGrid 8

// room A: a box made hollow is six walls, in the order +x -x +y -y +z -z
editorCreateBrush -256 -128 0 0 128 128
editorHollow 16
editorCreate light
editorSetKey light_1 origin "-128 0 96"
editorSetKey light_1 light_radius "320 320 320"
editorSetKey light_1 _color "1 0.95 0.85"
editorCreate info_player_start
editorSetKey info_player_start_1 origin "-136 0 24"
editorSetKey info_player_start_1 angle 0
editorWorldInfo
editorBuild
wait 10
editorPlay
wait 200
getviewpos
editorStop
wait 30

// room B next to it; the two walls between the rooms go
editorCreateBrush 0 -128 0 256 128 128
editorHollow 16
editorSelectBrush world 7
editorDeleteBrush
editorSelectBrush world 0
editorDeleteBrush
// the dividing wall with a doorway, 88 high (a zombie's AAS box is 82), and a visportal brush in it
editorCreateBrush -16 -128 0 16 -32 128
editorCreateBrush -16 32 0 16 128 128
editorCreateBrush -16 -32 104 16 32 128
editorCreateBrush -8 -32 16 8 32 104 textures/editor/visportal
editorBrushInfo
editorCreate light
editorSetKey light_2 origin "128 0 96"
editorSetKey light_2 light_radius "320 320 320"
editorWorldInfo
editorBuild
wait 10

// a low wall and a monster behind it: without AAS it would not find the way around
editorCreateBrush 120 -112 16 136 24 56
editorCreate monster_zombie_fat
editorSetKey monster_zombie_fat_1 origin "200 -40 24"
editorSetKey monster_zombie_fat_1 angle 180
editorBuild
editorWorldInfo
wait 10
editorPlay
wait 60
god
wait 60
aiStatus
wait 600
aiStatus
wait 600
aiStatus
wait 600
aiStatus
wait 600
aiStatus
editorStop
wait 30
editorWorldInfo
